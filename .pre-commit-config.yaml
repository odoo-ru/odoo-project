repos:
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.17.1
        hooks:
            -   id: ruff-check

    -   repo: https://github.com/PyCQA/flake8
        rev: 7.4.1
        hooks:
            -   id: flake8
                additional_dependencies:
                    - flake8-broken-line==1.0.0

    -   repo: https://github.com/rhysd/actionlint
        rev: v1.7.12
        hooks:
            -   id: actionlint

exclude: |
    (?x)(
        ^docs/_build/ |
        ^tests/project/
    )
